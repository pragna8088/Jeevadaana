spring.application.name=Jeevadaana

# ----- MySQL datasource (override via env vars in any environment) -----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jeevadaana}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:jeevadaana}
spring.datasource.password=${DB_PASSWORD:jeevadaana}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Seed reference/demo data on startup (idempotent)
app.seed.enabled=true

# ----- Thymeleaf -----
spring.thymeleaf.cache=false

server.port=${PORT:8080}
