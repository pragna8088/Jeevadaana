<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Find Camps - Jeevadaana')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<section class="container my-5">
    <h2 class="text-jd mb-1"><i class="bi bi-search"></i> District-wise Camp Search</h2>
    <p class="text-muted">Results update live via the REST API as you type.</p>

    <div class="row g-2 mb-4">
        <div class="col-md-9">
            <input type="text" id="districtSearch" class="form-control form-control-lg"
                   list="districtList" placeholder="Type a district (e.g. Bengaluru)" th:value="${district}"/>
            <datalist id="districtList"></datalist>
        </div>
        <div class="col-md-3 d-grid">
            <button type="button" id="clearBtn" class="btn btn-outline-secondary btn-lg">Show all</button>
        </div>
    </div>

    <div id="status" class="text-muted small mb-2"></div>
    <div id="noResults" class="alert alert-info d-none">No upcoming camps found for this district.</div>

    <div class="row g-4" id="campResults"><!-- camp cards injected by JS --></div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/camps.js}"></script>
</body>
</html>
