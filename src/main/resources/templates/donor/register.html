<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Donor Registration - Jeevadaana')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<section class="container">
    <div class="card auth-card" style="max-width:640px;">
        <div class="card-body p-4">
            <h3 class="text-jd mb-3"><i class="bi bi-person-plus"></i> Donor Registration</h3>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form method="post" th:action="@{/donor/register}" th:object="${form}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" th:field="*{name}"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" th:field="*{password}"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" th:field="*{phone}"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Blood Group</label>
                        <select class="form-select" th:field="*{bloodGroup}">
                            <option value="">Select</option>
                            <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg.label}"></option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('bloodGroup')}" th:errors="*{bloodGroup}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Gender</label>
                        <select class="form-select" th:field="*{gender}">
                            <option value="">Select</option>
                            <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control" th:field="*{age}"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">District</label>
                        <input type="text" class="form-control" th:field="*{district}"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('district')}" th:errors="*{district}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" th:field="*{address}"/>
                    </div>
                </div>
                <button type="submit" class="btn btn-jd w-100 mt-4">Register</button>
                <p class="text-center mt-3 mb-0">Already have an account?
                    <a th:href="@{/donor/login}" class="text-jd">Login</a></p>
            </form>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
